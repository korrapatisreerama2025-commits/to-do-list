<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura — Refined To-Do List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* -------------------------------------------------------------
       CSS RESET & VARIABLES (THEMES)
       ------------------------------------------------------------- */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* DARK THEME (Ultra-Glossy Refined Glassmorphism) */
    :root[data-theme="dark"] {
      --bg-body: #080b12;
      --bg-gradient: radial-gradient(circle at 50% 30%, #111726 0%, #06080e 100%);
      --card-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, rgba(20, 27, 45, 0.72) 28%, rgba(10, 15, 28, 0.8) 100%);
      --card-border: rgba(255, 255, 255, 0.18);
      --card-inner-shine: rgba(255, 255, 255, 0.45);
      --card-shadow: 0 40px 80px -15px rgba(0, 0, 0, 0.8), 0 20px 40px -10px rgba(0, 0, 0, 0.5), inset 0 1px 1px 0 rgba(255, 255, 255, 0.4), inset 0 -1px 1px 0 rgba(255, 255, 255, 0.1), inset 0 0 30px rgba(255, 255, 255, 0.04);
      --card-top-shine: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.75) 30%, #ffffff 50%, rgba(255, 255, 255, 0.75) 70%, transparent 100%);
      --card-top-glow: 0 0 10px rgba(255, 255, 255, 0.6);
      --card-gloss-sheen: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.04) 35%, transparent 65%);

      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;

      --input-bg: linear-gradient(180deg, rgba(8, 12, 22, 0.75) 0%, rgba(16, 22, 38, 0.6) 100%);
      --input-border: rgba(255, 255, 255, 0.14);
      --input-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3), inset 0 1px 1.5px rgba(255, 255, 255, 0.22), 0 4px 16px rgba(0, 0, 0, 0.12);
      --input-focus-border: rgba(96, 165, 250, 0.65);

      --accent-primary: #3b82f6;
      --accent-hover: #2563eb;
      --accent-soft: rgba(59, 130, 246, 0.18);
      --accent-glow: rgba(59, 130, 246, 0.35);

      --ring-track: rgba(255, 255, 255, 0.09);

      --pill-container-bg: rgba(8, 12, 22, 0.75);
      --pill-container-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3), inset 0 1px 1.5px rgba(255, 255, 255, 0.18);
      --pill-slider-bg: linear-gradient(180deg, rgba(255, 255, 255, 0.25) 0%, transparent 60%), #3b82f6;
      --pill-slider-shadow: 0 2px 10px rgba(0, 0, 0, 0.4), inset 0 1px 1.5px rgba(255, 255, 255, 0.55);

      --item-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.07) 0%, rgba(255, 255, 255, 0.02) 100%);
      --item-bg-hover: linear-gradient(135deg, rgba(255, 255, 255, 0.13) 0%, rgba(255, 255, 255, 0.05) 100%);
      --item-border: rgba(255, 255, 255, 0.12);
      --item-border-hover: rgba(255, 255, 255, 0.28);
      --item-shadow: inset 0 1px 1px 0 rgba(255, 255, 255, 0.22), 0 4px 16px -2px rgba(0, 0, 0, 0.18);
      --item-shadow-hover: inset 0 1px 1.5px 0 rgba(255, 255, 255, 0.45), 0 12px 30px -4px rgba(0, 0, 0, 0.25);
      --item-top-shine: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.28) 25%, rgba(255, 255, 255, 0.28) 75%, transparent 100%);
      --item-completed-bg: rgba(255, 255, 255, 0.015);

      --priority-high-text: #f87171;
      --priority-high-bg: rgba(239, 68, 68, 0.16);
      --priority-high-border: rgba(239, 68, 68, 0.35);

      --priority-med-text: #fbbf24;
      --priority-med-bg: rgba(245, 158, 11, 0.16);
      --priority-med-border: rgba(245, 158, 11, 0.35);

      --priority-low-text: #34d399;
      --priority-low-bg: rgba(16, 185, 129, 0.16);
      --priority-low-border: rgba(16, 185, 129, 0.35);

      --btn-icon-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.03) 100%);
      --btn-icon-border: rgba(255, 255, 255, 0.14);
      --btn-icon-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.35), 0 4px 12px rgba(0, 0, 0, 0.15);
      --btn-icon-color: #f8fafc;

      --stat-chip-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
      --stat-chip-border: rgba(255, 255, 255, 0.12);
      --stat-chip-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.28), 0 2px 8px rgba(0, 0, 0, 0.1);
      --stat-chip-label: #94a3b8;
    }

    /* LIGHT THEME (Liquid Crystal & Polished Acrylic Glass) */
    :root[data-theme="light"] {
      /* Soft elegant silver-slate backdrop for dramatic physical glass contrast */
      --bg-body: #dce4ef;
      --bg-gradient: radial-gradient(circle at 50% 25%, #eef4fa 0%, #cbd7e6 100%);
      /* Truly translucent crystal glass with vibrant refraction */
      --card-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.68) 0%, rgba(240, 246, 255, 0.44) 36%, rgba(226, 237, 250, 0.52) 100%);
      --card-border: rgba(255, 255, 255, 0.95);
      --card-inner-shine: #ffffff;
      /* Dual bevels: pure white top specular edge + refractive bottom shadow edge */
      --card-shadow:
        0 35px 75px -15px rgba(51, 65, 85, 0.22),
        0 15px 30px -8px rgba(51, 65, 85, 0.12),
        inset 0 1.5px 2px 0 #ffffff,
        inset 0 -2px 3px 0 rgba(148, 163, 184, 0.32),
        inset 0 0 25px rgba(255, 255, 255, 0.55);
      --card-top-shine: linear-gradient(90deg, transparent 0%, #ffffff 20%, #ffffff 50%, #ffffff 80%, transparent 100%);
      --card-top-glow: 0 1px 8px rgba(255, 255, 255, 1), 0 2px 10px rgba(71, 85, 105, 0.22);
      /* Bright curved gloss reflection sweep across surface */
      --card-gloss-sheen: linear-gradient(135deg, rgba(255, 255, 255, 0.85) 0%, rgba(255, 255, 255, 0.42) 25%, transparent 55%);

      --text-main: #0f172a;
      --text-muted: #475569;
      --text-dim: #94a3b8;

      --input-bg: linear-gradient(180deg, rgba(230, 238, 248, 0.82) 0%, rgba(242, 248, 255, 0.58) 100%);
      --input-border: rgba(255, 255, 255, 0.95);
      --input-shadow: inset 0 2px 4px rgba(71, 85, 105, 0.16), inset 0 1px 1.5px #ffffff, 0 4px 14px rgba(71, 85, 105, 0.08);
      --input-focus-border: rgba(37, 99, 235, 0.65);

      --accent-primary: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-soft: rgba(37, 99, 235, 0.15);
      --accent-glow: rgba(37, 99, 235, 0.32);

      --ring-track: rgba(0, 0, 0, 0.07);

      --pill-container-bg: linear-gradient(180deg, rgba(235, 242, 250, 0.85) 0%, rgba(245, 250, 255, 0.65) 100%);
      --pill-container-shadow: inset 0 2px 4px rgba(71, 85, 105, 0.14), inset 0 1px 1.5px #ffffff, 0 2px 8px rgba(71, 85, 105, 0.06);
      --pill-slider-bg: linear-gradient(180deg, rgba(255, 255, 255, 0.4) 0%, transparent 60%), #2563eb;
      --pill-slider-shadow: 0 2px 10px rgba(37, 99, 235, 0.35), inset 0 1px 1.5px rgba(255, 255, 255, 0.85);

      --item-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.75) 0%, rgba(240, 246, 255, 0.42) 100%);
      --item-bg-hover: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(240, 246, 255, 0.68) 100%);
      --item-border: rgba(255, 255, 255, 0.92);
      --item-border-hover: rgba(37, 99, 235, 0.45);
      --item-shadow: 0 4px 14px -2px rgba(71, 85, 105, 0.12), inset 0 1.5px 1.5px 0 #ffffff, inset 0 -1px 1px 0 rgba(148, 163, 184, 0.22);
      --item-shadow-hover: 0 12px 28px -4px rgba(71, 85, 105, 0.2), inset 0 1.5px 2px 0 #ffffff, inset 0 -1px 1.5px 0 rgba(148, 163, 184, 0.28);
      --item-top-shine: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.95) 25%, rgba(255, 255, 255, 0.95) 75%, transparent 100%);
      --item-completed-bg: rgba(235, 242, 250, 0.45);

      --priority-high-text: #dc2626;
      --priority-high-bg: rgba(239, 68, 68, 0.14);
      --priority-high-border: rgba(239, 68, 68, 0.35);

      --priority-med-text: #d97706;
      --priority-med-bg: rgba(245, 158, 11, 0.14);
      --priority-med-border: rgba(245, 158, 11, 0.35);

      --priority-low-text: #059669;
      --priority-low-bg: rgba(16, 185, 129, 0.14);
      --priority-low-border: rgba(16, 185, 129, 0.35);

      --btn-icon-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.85) 0%, rgba(240, 246, 255, 0.55) 100%);
      --btn-icon-border: rgba(255, 255, 255, 0.95);
      --btn-icon-shadow: inset 0 1.5px 1.5px #ffffff, inset 0 -1px 1px rgba(148, 163, 184, 0.2), 0 4px 12px rgba(71, 85, 105, 0.12);
      --btn-icon-color: #0f172a;

      --stat-chip-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.8) 0%, rgba(240, 246, 255, 0.5) 100%);
      --stat-chip-border: rgba(255, 255, 255, 0.92);
      --stat-chip-shadow: inset 0 1.5px 1.5px #ffffff, inset 0 -1px 1px rgba(148, 163, 184, 0.18), 0 2px 8px rgba(71, 85, 105, 0.1);
      --stat-chip-label: #64748b;
    }

    :root {
      --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
      --radius-app: 28px;
      --radius-item: 16px;
      --radius-pill: 9999px;
    }

    body {
      min-height: 100vh;
      background: var(--bg-body);
      background-image: var(--bg-gradient);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
      position: relative;
      overflow-x: hidden;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    /* -------------------------------------------------------------
       GAS / SMOKE CANVAS BACKGROUND
       ------------------------------------------------------------- */
    #gasCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      background: transparent;
    }

    /* -------------------------------------------------------------
       MAIN GLASSMORPHIC CARD (SPACIOUS & EXPANSIVE & ULTRA-GLOSSY)
       ------------------------------------------------------------- */
    .app-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 860px;
      min-height: 620px;
      background: var(--card-bg);
      backdrop-filter: blur(36px) saturate(210%) brightness(108%);
      -webkit-backdrop-filter: blur(36px) saturate(210%) brightness(108%);
      border-radius: var(--radius-app);
      border: 1px solid var(--card-border);
      box-shadow: var(--card-shadow);
      padding: 36px 38px 30px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      overflow: hidden;
      transition: max-width 0.35s var(--ease-spring), background 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
    }

    /* Compact toggle mode if user ever prefers narrow view */
    .app-container.compact-mode {
      max-width: 620px;
    }

    /* Full-width toggle mode */
    .app-container.expanded-mode {
      max-width: 1100px;
    }

    /* Crisp Top-Edge Specular Glow Line */
    .app-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 4%;
      right: 4%;
      height: 1.8px;
      background: var(--card-top-shine);
      border-radius: var(--radius-pill);
      pointer-events: none;
      box-shadow: var(--card-top-glow);
      z-index: 5;
    }

    /* Diagonal Curved Gloss Reflection Sweep across surface */
    .app-container::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 65%;
      background: var(--card-gloss-sheen);
      border-radius: var(--radius-app) var(--radius-app) 0 0;
      pointer-events: none;
      z-index: 1;
    }

    /* -------------------------------------------------------------
       HEADER & ACTIONS
       ------------------------------------------------------------- */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    .greeting-area {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .header-top-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .date-badge {
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--accent-primary);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .date-badge::before {
      content: '';
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-primary);
    }

    .greeting-title {
      font-size: 2.1rem;
      font-weight: 800;
      letter-spacing: -0.035em;
      line-height: 1.15;
      color: var(--text-main);
    }

    .greeting-subtitle {
      font-size: 0.92rem;
      color: var(--text-muted);
      font-weight: 400;
    }

    /* Header Controls (Size toggle, Theme toggle, Progress Ring) */
    .header-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .btn-icon-control {
      background: var(--btn-icon-bg);
      border: 1px solid var(--btn-icon-border);
      color: var(--btn-icon-color);
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      outline: none;
      box-shadow: var(--btn-icon-shadow);
      transition: all 0.25s var(--ease-spring);
    }

    .btn-icon-control:hover {
      transform: translateY(-1px);
      background: var(--accent-soft);
      border-color: var(--accent-primary);
      color: var(--accent-primary);
    }

    .btn-icon-control svg {
      width: 19px;
      height: 19px;
      stroke: currentColor;
      stroke-width: 2.1;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    /* Circular Progress Ring (Glossy Crystal Dial) */
    .progress-wrapper {
      position: relative;
      width: 66px;
      height: 66px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--btn-icon-bg);
      border: 1px solid var(--btn-icon-border);
      border-radius: 50%;
      box-shadow: var(--btn-icon-shadow);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .progress-svg {
      transform: rotate(-90deg);
      width: 54px;
      height: 54px;
    }

    .progress-track {
      fill: none;
      stroke: var(--ring-track);
      stroke-width: 5;
    }

    .progress-indicator {
      fill: none;
      stroke: var(--accent-primary);
      stroke-width: 5;
      stroke-linecap: round;
      stroke-dasharray: 175.93;
      stroke-dashoffset: 175.93;
      filter: drop-shadow(0 0 4px var(--accent-glow));
      transition: stroke-dashoffset 0.6s var(--ease-spring), stroke 0.4s ease;
    }

    .progress-text {
      position: absolute;
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--text-main);
      font-variant-numeric: tabular-nums;
    }

    /* -------------------------------------------------------------
       QUICK STATS ROW (DASHBOARD FEEL)
       ------------------------------------------------------------- */
    .stats-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .stat-chip {
      background: var(--stat-chip-bg);
      border: 1px solid var(--stat-chip-border);
      border-radius: 12px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--stat-chip-label);
      box-shadow: var(--stat-chip-shadow);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: background 0.25s ease;
    }

    .stat-chip-val {
      font-weight: 700;
      color: var(--text-main);
      font-variant-numeric: tabular-nums;
    }

    /* -------------------------------------------------------------
       INPUT BAR SECTION
       ------------------------------------------------------------- */
    .input-section {
      position: relative;
    }

    .input-wrapper {
      position: relative;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 20px;
      display: flex;
      align-items: center;
      padding: 7px 9px 7px 20px;
      gap: 12px;
      box-shadow: var(--input-shadow);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      transition: all 0.3s var(--ease-spring);
    }

    .input-wrapper:focus-within {
      border-color: var(--input-focus-border);
      box-shadow: 0 0 0 3px var(--accent-soft), 0 8px 24px -4px rgba(0, 0, 0, 0.15), inset 0 1px 1.5px rgba(255, 255, 255, 0.35);
    }

    .task-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 400;
    }

    .task-input::placeholder {
      color: var(--text-dim);
    }

    /* Priority Selector Dropdown */
    .priority-select-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .priority-select {
      appearance: none;
      -webkit-appearance: none;
      background: var(--card-bg);
      border: 1px solid var(--input-border);
      color: var(--text-muted);
      border-radius: 12px;
      padding: 8px 30px 8px 14px;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.2);
      transition: all 0.25s ease;
    }

    .priority-select:hover {
      color: var(--text-main);
      border-color: var(--input-focus-border);
    }

    .priority-select option {
      background: var(--bg-body);
      color: var(--text-main);
    }

    .priority-caret {
      position: absolute;
      right: 11px;
      pointer-events: none;
      width: 12px;
      height: 12px;
      stroke: var(--text-muted);
      stroke-width: 2.2;
      fill: none;
    }

    /* Add Button (Glossy Beveled Top Specular) */
    .btn-add {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.28) 0%, transparent 60%), var(--accent-primary);
      border: none;
      border-radius: 14px;
      color: #ffffff;
      padding: 10px 22px;
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: inset 0 1px 1.5px rgba(255, 255, 255, 0.65), 0 4px 16px var(--accent-glow);
      transition: all 0.25s var(--ease-spring);
      flex-shrink: 0;
    }

    .btn-add:hover {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.35) 0%, transparent 60%), var(--accent-hover);
      box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.8), 0 6px 20px var(--accent-glow);
      transform: translateY(-1px);
    }

    .btn-add:active {
      transform: scale(0.96);
    }

    .btn-add svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 2.5;
      fill: none;
    }

    /* -------------------------------------------------------------
       TOOLBAR (FILTERS & ACTIONS)
       ------------------------------------------------------------- */
    .toolbar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    /* Segmented Control Pill */
    .filter-pills-container {
      position: relative;
      background: var(--pill-container-bg);
      border: 1px solid var(--input-border);
      border-radius: var(--radius-pill);
      padding: 4px;
      display: inline-flex;
      align-items: center;
      box-shadow: var(--pill-container-shadow);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .filter-slider {
      position: absolute;
      top: 4px;
      bottom: 4px;
      left: 4px;
      background: var(--pill-slider-bg);
      border-radius: var(--radius-pill);
      box-shadow: var(--pill-slider-shadow);
      transition: transform 0.3s var(--ease-spring), width 0.3s var(--ease-spring);
      pointer-events: none;
      z-index: 1;
    }

    .filter-btn {
      position: relative;
      z-index: 2;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 7px 18px;
      border-radius: var(--radius-pill);
      cursor: pointer;
      transition: color 0.25s ease;
      display: flex;
      align-items: center;
      gap: 6px;
      outline: none;
    }

    .filter-btn.active {
      color: #ffffff;
    }

    .filter-count-badge {
      font-size: 0.72rem;
      background: rgba(255, 255, 255, 0.22);
      padding: 1px 7px;
      border-radius: var(--radius-pill);
      font-variant-numeric: tabular-nums;
    }

    .btn-clear {
      background: transparent;
      border: 1px solid var(--input-border);
      color: var(--text-dim);
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 500;
      padding: 7px 16px;
      border-radius: var(--radius-pill);
      cursor: pointer;
      transition: all 0.25s ease;
      outline: none;
    }

    .btn-clear:hover:not(:disabled) {
      color: #ef4444;
      border-color: rgba(239, 68, 68, 0.3);
      background: rgba(239, 68, 68, 0.08);
    }

    .btn-clear:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* -------------------------------------------------------------
       TASKS LIST
       ------------------------------------------------------------- */
    .task-list-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .task-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 160px;
    }

    .task-item {
      position: relative;
      background: var(--item-bg);
      border: 1px solid var(--item-border);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: var(--radius-item);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: grab;
      user-select: none;
      box-shadow: var(--item-shadow);
      transition:
        transform 0.25s var(--ease-spring),
        background-color 0.25s ease,
        border-color 0.25s ease,
        box-shadow 0.25s ease,
        opacity 0.25s ease;
      animation: taskSlideIn 0.35s var(--ease-spring) forwards;
      overflow: hidden;
    }

    /* Razor-thin top specular edge gleam */
    .task-item::before {
      content: '';
      position: absolute;
      top: 0;
      left: 12px;
      right: 12px;
      height: 1.2px;
      background: var(--item-top-shine);
      border-radius: var(--radius-pill);
      pointer-events: none;
      z-index: 2;
    }

    .task-item:hover {
      background: var(--item-bg-hover);
      border-color: var(--item-border-hover);
      transform: translateY(-2px);
      box-shadow: var(--item-shadow-hover);
    }

    .task-item.dragging {
      opacity: 0.35;
      cursor: grabbing;
      transform: scale(0.98);
      border-color: var(--accent-primary);
    }

    .task-item.drag-over {
      border-top: 2px solid var(--accent-primary);
      transform: translateY(2px);
    }

    .task-item.deleting {
      animation: taskSlideOut 0.3s var(--ease-spring) forwards;
    }

    @keyframes taskSlideIn {
      0% {
        opacity: 0;
        transform: translateY(-10px) scale(0.98);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes taskSlideOut {
      0% {
        opacity: 1;
        transform: translateX(0) scale(1);
        max-height: 80px;
        margin-bottom: 10px;
        padding-top: 14px;
        padding-bottom: 14px;
      }
      100% {
        opacity: 0;
        transform: translateX(25px) scale(0.92);
        max-height: 0;
        margin-bottom: 0;
        padding-top: 0;
        padding-bottom: 0;
        border-color: transparent;
      }
    }

    /* Drag Handle */
    .drag-handle {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      opacity: 0.4;
      cursor: grab;
      transition: opacity 0.2s ease, color 0.2s ease;
      flex-shrink: 0;
    }

    .task-item:hover .drag-handle {
      opacity: 0.85;
      color: var(--text-muted);
    }

    .drag-handle svg {
      width: 15px;
      height: 15px;
      fill: currentColor;
    }

    /* Custom Glossy Checkbox */
    .checkbox-btn {
      position: relative;
      width: 24px;
      height: 24px;
      border-radius: 8px;
      background: var(--btn-icon-bg);
      border: 1.5px solid var(--btn-icon-border);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: var(--btn-icon-shadow);
      transition: all 0.25s var(--ease-spring);
      outline: none;
    }

    .checkbox-btn:hover {
      border-color: var(--accent-primary);
      background: var(--accent-soft);
      box-shadow: inset 0 1px 1.5px rgba(255, 255, 255, 0.6), 0 0 12px var(--accent-glow);
    }

    .checkbox-btn svg {
      width: 14px;
      height: 14px;
      stroke: #ffffff;
      stroke-width: 2.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      stroke-dasharray: 20;
      stroke-dashoffset: 20;
      transition: stroke-dashoffset 0.25s ease;
    }

    /* Completed Task Styling */
    .task-item.completed {
      background: var(--item-completed-bg);
      border-color: transparent;
    }

    .task-item.completed .checkbox-btn {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.3) 0%, transparent 60%), var(--accent-primary);
      border-color: var(--accent-primary);
      box-shadow: inset 0 1px 1.5px rgba(255, 255, 255, 0.65), 0 2px 10px var(--accent-glow);
    }

    .task-item.completed .checkbox-btn svg {
      stroke-dashoffset: 0;
    }

    .task-item.completed .task-text {
      color: var(--text-dim);
      text-decoration: line-through;
    }

    /* Task Content */
    .task-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .task-text {
      font-size: 0.98rem;
      font-weight: 500;
      color: var(--text-main);
      word-break: break-word;
      transition: color 0.25s ease;
      cursor: text;
    }

    .task-hint {
      font-size: 0.7rem;
      color: var(--text-dim);
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .task-item:hover .task-hint {
      opacity: 0.75;
    }

    /* Inline Edit Input */
    .inline-edit-input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--accent-primary);
      border-radius: 8px;
      padding: 5px 10px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.98rem;
      font-weight: 500;
      outline: none;
      box-shadow: 0 0 0 3px var(--accent-soft), inset 0 1px 1.5px rgba(255, 255, 255, 0.3);
    }

    /* Priority Badges (Glossy Gemstone/Acrylic look) */
    .priority-badge {
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 4px 11px;
      border-radius: var(--radius-pill);
      flex-shrink: 0;
      border: 1px solid transparent;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.35), 0 2px 6px rgba(0, 0, 0, 0.15);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .priority-badge.high {
      color: var(--priority-high-text);
      background: var(--priority-high-bg);
      border-color: var(--priority-high-border);
    }

    .priority-badge.medium {
      color: var(--priority-med-text);
      background: var(--priority-med-bg);
      border-color: var(--priority-med-border);
    }

    .priority-badge.low {
      color: var(--priority-low-text);
      background: var(--priority-low-bg);
      border-color: var(--priority-low-border);
    }

    /* Delete Button */
    .btn-delete {
      background: transparent;
      border: none;
      color: var(--text-dim);
      border-radius: 8px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0.45;
      transition: all 0.2s ease;
      flex-shrink: 0;
      outline: none;
    }

    .task-item:hover .btn-delete {
      opacity: 0.85;
    }

    .btn-delete:hover {
      opacity: 1 !important;
      color: #ef4444;
      background: rgba(239, 68, 68, 0.12);
      transform: scale(1.08);
    }

    .btn-delete:active {
      transform: scale(0.92);
    }

    .btn-delete svg {
      width: 17px;
      height: 17px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }

    /* -------------------------------------------------------------
       EMPTY STATE
       ------------------------------------------------------------- */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 50px 20px;
      text-align: center;
      gap: 14px;
      border-radius: var(--radius-item);
      background: var(--item-bg);
      border: 1px dashed var(--input-border);
      animation: taskSlideIn 0.3s var(--ease-spring);
    }

    .empty-icon-wrap {
      width: 60px;
      height: 60px;
      border-radius: 18px;
      background: var(--card-bg);
      border: 1px solid var(--input-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      box-shadow: 0 8px 18px -4px rgba(0, 0, 0, 0.1);
    }

    .empty-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .empty-subtitle {
      font-size: 0.88rem;
      color: var(--text-muted);
      max-width: 360px;
      line-height: 1.5;
    }

    /* -------------------------------------------------------------
       FOOTER STATS BAR
       ------------------------------------------------------------- */
    .footer-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--input-border);
      padding-top: 18px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .task-counter {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .task-counter-num {
      color: var(--text-main);
      font-weight: 700;
    }

    .footer-tips {
      font-size: 0.76rem;
      color: var(--text-dim);
    }

    /* -------------------------------------------------------------
       RESPONSIVE ADJUSTMENTS
       ------------------------------------------------------------- */
    @media (max-width: 768px) {
      body {
        padding: 16px 12px;
      }

      .app-container {
        padding: 26px 20px 22px;
        border-radius: 22px;
        gap: 18px;
        min-height: auto;
      }

      .greeting-title {
        font-size: 1.6rem;
      }

      .progress-wrapper {
        width: 58px;
        height: 58px;
      }

      .progress-svg {
        width: 58px;
        height: 58px;
      }

      .input-wrapper {
        flex-wrap: wrap;
        padding: 10px 12px;
        gap: 8px;
      }

      .task-input {
        width: 100%;
        min-width: 100%;
      }

      .priority-select-wrapper {
        flex: 1;
      }

      .priority-select {
        width: 100%;
      }

      .btn-add {
        flex: 1;
        justify-content: center;
      }

      .toolbar-row {
        flex-direction: column;
        align-items: stretch;
      }

      .filter-pills-container {
        width: 100%;
        display: flex;
      }

      .filter-btn {
        flex: 1;
        justify-content: center;
      }

      .btn-clear {
        text-align: center;
      }

      .footer-tips {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- Dynamic Flowing Gas & Cursor Smoke Canvas Background -->
  <canvas id="gasCanvas"></canvas>

  <!-- Main Glassmorphic To-Do App (Generous, Spacious Desktop-Grade Layout) -->
  <main class="app-container" id="appContainer" role="application" aria-label="Aura To-Do App">

  <!-- -------------------------------------------------------------
       SMOKE & GAS SIMULATION + APP LOGIC
       ------------------------------------------------------------- -->
  <script>
    /* =============================================================
       1. WHOLE-BACKGROUND CONTINUOUS VOLUMETRIC GAS SIMULATION
       - Flowing, rolling, billowing gas across the ENTIRE background
       - Corner nozzle vents + ambient atmospheric drifting vapor
       - Pre-rendered Gaussian puff sprite for silky 60fps performance
       - Multi-scale curl turbulence for authentic fluid eddies
       - Full-screen cursor reaction: gas parts and swirls anywhere you move
       - 100% transparent canvas background
       ============================================================= */
    const canvas = document.getElementById('gasCanvas');
    const ctx = canvas.getContext('2d');

    let width = 0;
    let height = 0;
    let particles = [];
    const MAX_PARTICLES = 190;

    // Pre-render soft Gaussian smoke puff sprites for Dark and Light modes
    function createPuffSprite(r, g, b) {
      const pCan = document.createElement('canvas');
      const pSize = 256;
      pCan.width = pSize;
      pCan.height = pSize;
      const pCtx = pCan.getContext('2d');
      const half = pSize / 2;

      // Realistic volumetric exponential Gaussian-style falloff
      const grad = pCtx.createRadialGradient(half, half, 0, half, half, half);
      grad.addColorStop(0, `rgba(${r}, ${g}, ${b}, 0.52)`);
      grad.addColorStop(0.22, `rgba(${r}, ${g}, ${b}, 0.30)`);
      grad.addColorStop(0.52, `rgba(${r}, ${g}, ${b}, 0.11)`);
      grad.addColorStop(0.80, `rgba(${r}, ${g}, ${b}, 0.025)`);
      grad.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);

      pCtx.fillStyle = grad;
      pCtx.beginPath();
      pCtx.arc(half, half, half, 0, Math.PI * 2);
      pCtx.fill();
      return pCan;
    }

    const darkPuffSprite = createPuffSprite(135, 160, 215);
    const lightPuffSprite = createPuffSprite(155, 172, 202);

    // 4 Corner Vent Nozzles
    const CORNERS = [
      { id: 'top-left', origin: (w, h) => ({ x: -20, y: -20 }), angle: (w, h) => Math.atan2(h * 0.5, w * 0.5) },
      { id: 'top-right', origin: (w, h) => ({ x: w + 20, y: -20 }), angle: (w, h) => Math.atan2(h * 0.5, -w * 0.5) },
      { id: 'bottom-left', origin: (w, h) => ({ x: -20, y: h + 20 }), angle: (w, h) => Math.atan2(-h * 0.5, w * 0.5) },
      { id: 'bottom-right', origin: (w, h) => ({ x: w + 20, y: h + 20 }), angle: (w, h) => Math.atan2(-h * 0.5, -w * 0.5) }
    ];

    const mouse = {
      x: -1000,
      y: -1000,
      lastX: -1000,
      lastY: -1000,
      vx: 0,
      vy: 0,
      speed: 0
    };

    function resizeCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.resetTransform ? ctx.resetTransform() : ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    window.addEventListener('mousemove', (e) => {
      if (mouse.lastX < 0) {
        mouse.lastX = e.clientX;
        mouse.lastY = e.clientY;
      }
      mouse.vx = e.clientX - mouse.lastX;
      mouse.vy = e.clientY - mouse.lastY;
      mouse.speed = Math.hypot(mouse.vx, mouse.vy);
      mouse.x = e.clientX;
      mouse.y = e.clientY;
      mouse.lastX = e.clientX;
      mouse.lastY = e.clientY;
    });

    window.addEventListener('mouseleave', () => {
      mouse.x = -1000;
      mouse.y = -1000;
      mouse.vx = 0;
      mouse.vy = 0;
      mouse.lastX = -1000;
      mouse.lastY = -1000;
    });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        const touch = e.touches[0];
        const tx = touch.clientX;
        const ty = touch.clientY;
        if (mouse.lastX < 0) {
          mouse.lastX = tx;
          mouse.lastY = ty;
        }
        mouse.vx = tx - mouse.lastX;
        mouse.vy = ty - mouse.lastY;
        mouse.speed = Math.hypot(mouse.vx, mouse.vy);
        mouse.x = tx;
        mouse.y = ty;
        mouse.lastX = tx;
        mouse.lastY = ty;
      }
    }, { passive: true });

    // Spawn corner high-speed plume puff
    function spawnCornerPuff(cornerIdx) {
      const corner = CORNERS[cornerIdx];
      const pos = corner.origin(width, height);

      const x = pos.x + (Math.random() - 0.5) * 30;
      const y = pos.y + (Math.random() - 0.5) * 30;

      const targetAngle = corner.angle(width, height) + (Math.random() - 0.5) * 0.65;
      const speed = 0.85 + Math.random() * 0.95;
      const vx = Math.cos(targetAngle) * speed;
      const vy = Math.sin(targetAngle) * speed;

      const baseRadius = 30 + Math.random() * 20;
      const maxLife = 260 + Math.random() * 160;

      return {
        x,
        y,
        vx,
        vy,
        baseRadius,
        radius: baseRadius,
        growthRate: 0.65 + Math.random() * 0.45,
        rotation: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 0.01,
        life: 0,
        maxLife,
        isAmbient: false
      };
    }

    // Spawn full-screen ambient drifting vapor puff (ensures whole background has living gas)
    function spawnAmbientPuff(spawnAnywhere = false) {
      let x, y, vx, vy;
      if (spawnAnywhere) {
        x = Math.random() * width;
        y = Math.random() * height;
      } else {
        // Emit from bottom or sides to drift across
        if (Math.random() < 0.6) {
          x = Math.random() * width;
          y = height + 30;
        } else {
          x = Math.random() < 0.5 ? -30 : width + 30;
          y = Math.random() * height;
        }
      }

      vx = (Math.random() - 0.5) * 0.6;
      vy = -(0.35 + Math.random() * 0.65);

      const baseRadius = 60 + Math.random() * 60;
      const maxLife = 320 + Math.random() * 220;

      return {
        x,
        y,
        vx,
        vy,
        baseRadius,
        radius: baseRadius,
        growthRate: 0.45 + Math.random() * 0.4,
        rotation: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 0.008,
        life: spawnAnywhere ? Math.floor(Math.random() * maxLife * 0.8) : 0,
        maxLife,
        isAmbient: true
      };
    }

    // Initialize full-screen gas so whole background is alive with flowing gas on launch
    for (let i = 0; i < 110; i++) {
      particles.push(spawnAmbientPuff(true));
    }
    for (let c = 0; c < 4; c++) {
      for (let i = 0; i < 18; i++) {
        const p = spawnCornerPuff(c);
        p.life = Math.floor(Math.random() * p.maxLife * 0.75);
        p.x += p.vx * p.life;
        p.y += p.vy * p.life;
        p.radius = p.baseRadius + p.life * p.growthRate;
        particles.push(p);
      }
    }

    let frameCount = 0;

    // Main 60fps Volumetric Whole-Background Gas Loop
    function updateAndRenderGas() {
      ctx.clearRect(0, 0, width, height);

      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      const activeSprite = isDark ? darkPuffSprite : lightPuffSprite;
      const peakAlpha = isDark ? 0.062 : 0.072;

      frameCount++;

      // Non-stop Corner Influx (all 4 corners emit continuously)
      for (let c = 0; c < 4; c++) {
        if (particles.length < MAX_PARTICLES) {
          particles.push(spawnCornerPuff(c));
        }
      }

      // Continuous Ambient Vapor Influx across whole background
      if (particles.length < MAX_PARTICLES && frameCount % 2 === 0) {
        particles.push(spawnAmbientPuff(false));
      }

      const time = performance.now() * 0.00045;

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life++;

        // Wrap or remove if fully dissipated
        if (p.life >= p.maxLife || p.y < -p.radius * 2.2 || p.x < -p.radius * 2.2 || p.x > width + p.radius * 2.2) {
          particles.splice(i, 1);
          continue;
        }

        // Global Curl Turbulence Field: undulates and circulates gas across whole screen
        const s1 = 0.0016, s2 = 0.0038;
        const curlX = Math.sin(p.y * s1 + time * 0.8) * 0.45 + Math.cos(p.x * s2 - time * 1.1) * 0.25;
        const curlY = -0.28 + Math.cos(p.x * s1 - time * 0.6) * 0.4 + Math.sin(p.y * s2 + time * 0.9) * 0.25;
        p.vx += curlX * 0.024;
        p.vy += curlY * 0.024;

        p.radius += p.growthRate * 0.38;
        p.rotation += p.rotSpeed;

        // AERODYNAMIC CURSOR INTERACTION (Active across WHOLE screen)
        if (mouse.x > -500) {
          const dx = p.x - mouse.x;
          const dy = p.y - mouse.y;
          const dist = Math.hypot(dx, dy);
          const influenceRadius = p.radius + 135;

          if (dist < influenceRadius && dist > 1) {
            const factor = 1 - dist / influenceRadius;
            const push = factor * factor * 4.6;
            const nx = dx / dist;
            const ny = dy / dist;

            // 1. Direct radial push away from cursor
            p.vx += nx * push;
            p.vy += ny * push;

            // 2. Swirling vortex eddy
            p.vx += -ny * factor * 2.0;
            p.vy += nx * factor * 2.0;

            // 3. Fluid momentum wake
            if (mouse.speed > 0.4) {
              p.vx += mouse.vx * factor * 0.35;
              p.vy += mouse.vy * factor * 0.35;
            }

            p.rotation += factor * 0.06;
          }
        }

        // Fluid drag (gentle air resistance for silky natural drift)
        p.vx *= 0.978;
        p.vy *= 0.978;
        p.x += p.vx;
        p.y += p.vy;

        // Smooth opacity curve
        const progress = p.life / p.maxLife;
        let alpha = 0;
        if (progress < 0.2) {
          alpha = (progress / 0.2) * peakAlpha;
        } else if (progress > 0.62) {
          alpha = (1 - (progress - 0.62) / 0.38) * peakAlpha;
        } else {
          alpha = peakAlpha;
        }

        // Render soft Gaussian volumetric puff
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation);
        const diam = p.radius * 2;
        ctx.drawImage(activeSprite, -p.radius, -p.radius, diam, diam);
        ctx.restore();
      }

      mouse.vx *= 0.85;
      mouse.vy *= 0.85;

      requestAnimationFrame(updateAndRenderGas);
    }
    requestAnimationFrame(updateAndRenderGas);
    requestAnimationFrame(updateAndRenderGas);


    /* =============================================================
       2. THEME & CONTAINER SIZE SWITCHER
       ============================================================= */
    const THEME_KEY = 'aura_theme_preference';
    const SIZE_KEY = 'aura_size_preference';

    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const themeIcon = document.getElementById('themeIcon');
    const sizeToggleBtn = document.getElementById('sizeToggleBtn');
    const sizeIcon = document.getElementById('sizeIcon');
    const appContainer = document.getElementById('appContainer');

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem(THEME_KEY, theme);

      if (theme === 'dark') {
        themeIcon.innerHTML = `
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        `;
      } else {
        themeIcon.innerHTML = `
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        `;
      }
    }

    // Size Modes: 'spacious' (default 860px) | 'compact' (620px) | 'expanded' (1100px)
    let currentSizeMode = 'spacious';

    function applySizeMode(mode) {
      currentSizeMode = mode;
      appContainer.classList.remove('compact-mode', 'expanded-mode');
      if (mode === 'compact') {
        appContainer.classList.add('compact-mode');
      } else if (mode === 'expanded') {
        appContainer.classList.add('expanded-mode');
      }
      localStorage.setItem(SIZE_KEY, mode);
      setTimeout(updateFilterSliderPosition, 100);
    }

    function initThemeAndSize() {
      const savedTheme = localStorage.getItem(THEME_KEY);
      if (savedTheme) {
        applyTheme(savedTheme);
      } else {
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        applyTheme(prefersDark ? 'dark' : 'light');
      }

      themeToggleBtn.addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
      });

      const savedSize = localStorage.getItem(SIZE_KEY) || 'spacious';
      applySizeMode(savedSize);

      sizeToggleBtn.addEventListener('click', () => {
        // Cycle: spacious (860px) -> expanded (1100px) -> compact (620px) -> spacious
        if (currentSizeMode === 'spacious') {
          applySizeMode('expanded');
        } else if (currentSizeMode === 'expanded') {
          applySizeMode('compact');
        } else {
          applySizeMode('spacious');
        }
      });
    }


    /* =============================================================
       3. TO-DO APPLICATION LOGIC
       ============================================================= */
    const STORAGE_KEY = 'aura_premium_todos_v1';

    let tasks = [];
    let currentFilter = 'all';
    let draggedItemId = null;

    // DOM Elements
    const taskInput = document.getElementById('taskInput');
    const prioritySelect = document.getElementById('prioritySelect');
    const taskList = document.getElementById('taskList');
    const currentDate = document.getElementById('currentDate');
    const greetingText = document.getElementById('greetingText');
    const taskSummaryText = document.getElementById('taskSummaryText');
    const progressIndicator = document.getElementById('progressIndicator');
    const progressPercent = document.getElementById('progressPercent');
    const countAll = document.getElementById('countAll');
    const countActive = document.getElementById('countActive');
    const countCompleted = document.getElementById('countCompleted');
    const chipTotal = document.getElementById('chipTotal');
    const chipActive = document.getElementById('chipActive');
    const chipCompleted = document.getElementById('chipCompleted');
    const chipRate = document.getElementById('chipRate');
    const tasksLeftCount = document.getElementById('tasksLeftCount');
    const tasksLeftLabel = document.getElementById('tasksLeftLabel');
    const btnClearCompleted = document.getElementById('btnClearCompleted');
    const filterPills = document.getElementById('filterPills');
    const filterSlider = document.getElementById('filterSlider');

    const RING_CIRCUMFERENCE = 2 * Math.PI * 27; // ~169.64

    function initApp() {
      initThemeAndSize();
      setupHeaderDates();
      loadTasks();

      if (!tasks || tasks.length === 0) {
        if (!localStorage.getItem('aura_has_visited')) {
          tasks = [
            {
              id: 'seed-1',
              text: 'Design elegant macOS fluid interface with spacious layout',
              priority: 'high',
              completed: false,
              createdAt: Date.now() - 3600000
            },
            {
              id: 'seed-2',
              text: 'Review light and dark contrast typography & color tones',
              priority: 'medium',
              completed: true,
              createdAt: Date.now() - 7200000
            },
            {
              id: 'seed-3',
              text: 'Afternoon coffee and mindful meditation break',
              priority: 'low',
              completed: false,
              createdAt: Date.now() - 1800000
            }
          ];
          saveTasks();
          localStorage.setItem('aura_has_visited', 'true');
        }
      }

      setupFilterListeners();
      render();
      window.addEventListener('resize', updateFilterSliderPosition);
    }

    function setupHeaderDates() {
      const now = new Date();
      const hour = now.getHours();

      if (hour >= 5 && hour < 12) {
        greetingText.textContent = 'Good morning';
      } else if (hour >= 12 && hour < 17) {
        greetingText.textContent = 'Good afternoon';
      } else if (hour >= 17 && hour < 22) {
        greetingText.textContent = 'Good evening';
      } else {
        greetingText.textContent = 'Good night';
      }

      const options = { weekday: 'long', month: 'short', day: 'numeric' };
      currentDate.textContent = now.toLocaleDateString('en-US', options);
    }

    function loadTasks() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        tasks = stored ? JSON.parse(stored) : [];
      } catch (err) {
        console.error('Error loading tasks', err);
        tasks = [];
      }
    }

    function saveTasks() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      } catch (err) {
        console.error('Error saving tasks', err);
      }
    }

    function handleAddTask() {
      const text = taskInput.value.trim();
      if (!text) {
        taskInput.focus();
        return;
      }

      const newTask = {
        id: 'task_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6),
        text: text,
        priority: prioritySelect.value,
        completed: false,
        createdAt: Date.now()
      };

      tasks.unshift(newTask);
      saveTasks();

      taskInput.value = '';
      taskInput.focus();

      render();
    }

    function toggleTask(id) {
      const item = tasks.find(t => t.id === id);
      if (item) {
        item.completed = !item.completed;
        saveTasks();
        render();
      }
    }

    function deleteTask(id, element) {
      if (element) {
        element.classList.add('deleting');
        element.addEventListener('animationend', () => {
          tasks = tasks.filter(t => t.id !== id);
          saveTasks();
          render();
        }, { once: true });
      } else {
        tasks = tasks.filter(t => t.id !== id);
        saveTasks();
        render();
      }
    }

    function clearCompletedTasks() {
      const completedCount = tasks.filter(t => t.completed).length;
      if (completedCount === 0) return;

      const domItems = document.querySelectorAll('.task-item.completed');
      if (domItems.length > 0) {
        domItems.forEach(el => el.classList.add('deleting'));
        setTimeout(() => {
          tasks = tasks.filter(t => !t.completed);
          saveTasks();
          render();
        }, 280);
      } else {
        tasks = tasks.filter(t => !t.completed);
        saveTasks();
        render();
      }
    }

    function startInlineEdit(id, textContainer) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;

      const currentText = task.text;
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'inline-edit-input';
      input.value = currentText;
      input.maxLength = 160;

      textContainer.replaceWith(input);
      input.focus();
      input.select();

      let finished = false;

      function saveEdit() {
        if (finished) return;
        finished = true;
        const newText = input.value.trim();
        if (newText) {
          task.text = newText;
          saveTasks();
        }
        render();
      }

      function cancelEdit() {
        if (finished) return;
        finished = true;
        render();
      }

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') saveEdit();
        else if (e.key === 'Escape') cancelEdit();
      });

      input.addEventListener('blur', saveEdit);
    }

    function setupFilterListeners() {
      const filterBtns = filterPills.querySelectorAll('.filter-btn');
      filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          filterBtns.forEach(b => {
            b.classList.remove('active');
            b.setAttribute('aria-selected', 'false');
          });
          btn.classList.add('active');
          btn.setAttribute('aria-selected', 'true');
          currentFilter = btn.dataset.filter;
          updateFilterSliderPosition();
          renderTaskList();
        });
      });
      setTimeout(updateFilterSliderPosition, 50);
    }

    function updateFilterSliderPosition() {
      const activeBtn = filterPills.querySelector('.filter-btn.active');
      if (activeBtn && filterSlider) {
        filterSlider.style.width = `${activeBtn.offsetWidth}px`;
        filterSlider.style.transform = `translateX(${activeBtn.offsetLeft - 4}px)`;
      }
    }

    function handleDragStart(e, id) {
      draggedItemId = id;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', id);
      const row = e.target.closest('.task-item');
      if (row) {
        setTimeout(() => row.classList.add('dragging'), 0);
      }
    }

    function handleDragEnd() {
      draggedItemId = null;
      document.querySelectorAll('.task-item').forEach(el => {
        el.classList.remove('dragging');
        el.classList.remove('drag-over');
      });
    }

    function handleDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      const targetItem = e.target.closest('.task-item');
      if (targetItem && targetItem.dataset.id !== draggedItemId) {
        document.querySelectorAll('.task-item').forEach(el => el.classList.remove('drag-over'));
        targetItem.classList.add('drag-over');
      }
    }

    function handleDrop(e, targetId) {
      e.preventDefault();
      document.querySelectorAll('.task-item').forEach(el => el.classList.remove('drag-over'));

      if (!draggedItemId || draggedItemId === targetId) return;

      const fromIndex = tasks.findIndex(t => t.id === draggedItemId);
      const toIndex = tasks.findIndex(t => t.id === targetId);

      if (fromIndex !== -1 && toIndex !== -1) {
        const [movedItem] = tasks.splice(fromIndex, 1);
        tasks.splice(toIndex, 0, movedItem);
        saveTasks();
        render();
      }
    }

    function updateProgressAndStats() {
      const total = tasks.length;
      const completed = tasks.filter(t => t.completed).length;
      const active = total - completed;

      countAll.textContent = total;
      countActive.textContent = active;
      countCompleted.textContent = completed;

      // Update Quick Stats Chips
      chipTotal.textContent = total;
      chipActive.textContent = active;
      chipCompleted.textContent = completed;

      const percent = total === 0 ? 0 : Math.round((completed / total) * 100);
      chipRate.textContent = `${percent}%`;

      tasksLeftCount.textContent = active;
      tasksLeftLabel.textContent = active === 1 ? 'task left' : 'tasks left';

      btnClearCompleted.disabled = completed === 0;

      progressPercent.textContent = `${percent}%`;

      const offset = RING_CIRCUMFERENCE - (RING_CIRCUMFERENCE * percent) / 100;
      progressIndicator.style.strokeDasharray = RING_CIRCUMFERENCE;
      progressIndicator.style.strokeDashoffset = offset;

      if (total === 0) {
        taskSummaryText.textContent = 'Add a task above to begin your day.';
      } else if (percent === 100) {
        taskSummaryText.textContent = 'All tasks completed! Exceptional focus.';
      } else if (percent >= 50) {
        taskSummaryText.textContent = `${percent}% done — steady progress.`;
      } else {
        taskSummaryText.textContent = `${active} active ${active === 1 ? 'task' : 'tasks'} remaining today.`;
      }
    }

    function render() {
      updateProgressAndStats();
      renderTaskList();
      updateFilterSliderPosition();
    }

    function renderTaskList() {
      taskList.innerHTML = '';

      const filtered = tasks.filter(task => {
        if (currentFilter === 'active') return !task.completed;
        if (currentFilter === 'completed') return task.completed;
        return true;
      });

      if (filtered.length === 0) {
        renderEmptyState();
        return;
      }

      filtered.forEach(task => {
        const li = document.createElement('li');
        li.className = `task-item ${task.completed ? 'completed' : ''}`;
        li.dataset.id = task.id;
        li.draggable = true;

        li.addEventListener('dragstart', (e) => handleDragStart(e, task.id));
        li.addEventListener('dragend', handleDragEnd);
        li.addEventListener('dragover', handleDragOver);
        li.addEventListener('drop', (e) => handleDrop(e, task.id));

        const priorityLabels = { high: 'High', medium: 'Med', low: 'Low' };
        const priorityLabel = priorityLabels[task.priority] || 'Med';

        li.innerHTML = `
          <div class="drag-handle" title="Drag to reorder" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <circle cx="9" cy="6" r="1.5"></circle>
              <circle cx="15" cy="6" r="1.5"></circle>
              <circle cx="9" cy="12" r="1.5"></circle>
              <circle cx="15" cy="12" r="1.5"></circle>
              <circle cx="9" cy="18" r="1.5"></circle>
              <circle cx="15" cy="18" r="1.5"></circle>
            </svg>
          </div>

          <button
            type="button"
            class="checkbox-btn"
            role="checkbox"
            aria-checked="${task.completed}"
            aria-label="Toggle task completed"
            title="${task.completed ? 'Mark incomplete' : 'Mark complete'}"
          >
            <svg viewBox="0 0 24 24">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </button>

          <div class="task-content">
            <span class="task-text" title="Double click to edit">${escapeHTML(task.text)}</span>
            <span class="task-hint">Double-click to edit</span>
          </div>

          <span class="priority-badge ${task.priority}" title="${task.priority.toUpperCase()} Priority">
            ${priorityLabel}
          </span>

          <button
            type="button"
            class="btn-delete"
            aria-label="Delete task"
            title="Delete task"
          >
            <svg viewBox="0 0 24 24">
              <path d="M3 6h18m-2 0v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6m3 0V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
              <line x1="10" y1="11" x2="10" y2="17"></line>
              <line x1="14" y1="11" x2="14" y2="17"></line>
            </svg>
          </button>
        `;

        const checkbox = li.querySelector('.checkbox-btn');
        checkbox.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleTask(task.id);
        });

        const textSpan = li.querySelector('.task-text');
        textSpan.addEventListener('dblclick', (e) => {
          e.stopPropagation();
          startInlineEdit(task.id, textSpan);
        });

        const deleteBtn = li.querySelector('.btn-delete');
        deleteBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          deleteTask(task.id, li);
        });

        taskList.appendChild(li);
      });
    }

    function renderEmptyState() {
      let icon = '☕';
      let title = 'All caught up!';
      let desc = 'You have no tasks here. Relax, recharge, or add a new goal above.';

      if (currentFilter === 'active') {
        icon = '🌱';
        title = 'Zero active tasks';
        desc = 'Every single item is complete! Enjoy your free time.';
      } else if (currentFilter === 'completed') {
        icon = '🎯';
        title = 'No completed tasks yet';
        desc = 'Check off tasks as you finish them to track your accomplishments.';
      }

      taskList.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon-wrap" aria-hidden="true">${icon}</div>
          <h3 class="empty-title">${title}</h3>
          <p class="empty-subtitle">${desc}</p>
        </div>
      `;
    }

    function escapeHTML(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    document.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
